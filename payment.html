<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06122a">

<title>Kulzzy Radio — Payment</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #06122a;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

.payment-box {
  width: 100%;
  max-width: 420px;
  padding: 30px 22px;
  text-align: center;
  background: #0c1d3b;
  border: 2px solid #d4af37;
  border-radius: 18px;
}

h1 {
  margin-top: 0;
  color: #ffd700;
  font-size: 27px;
}

.subtitle {
  line-height: 1.7;
  color: #ffffff;
  font-size: 16px;
}

.amount {
  margin: 25px 0;
  color: #ffd700;
  font-size: 30px;
  font-weight: bold;
}

.pay-button {
  display: block;
  width: 100%;
  padding: 17px 12px;
  border: none;
  border-radius: 10px;
  background: #ffd700;
  color: #06122a;
  font-size: 18px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

.pay-button:active {
  transform: scale(0.98);
}

.note {
  margin-top: 20px;
  color: #cccccc;
  font-size: 13px;
  line-height: 1.6;
}

.footer {
  margin-top: 25px;
  color: #ffd700;
  font-size: 13px;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="payment-box">

  <h1>KULZZY RADIO</h1>

  <p class="subtitle">
    AM CELEBRATING TODAY<br>
    MENTION MY NAME ON-AIR
  </p>

  <div class="amount">₦3,000</div>

  <p class="subtitle">
    Your celebration booking is almost complete.
    Tap below to continue to secure payment.
  </p>

  <a
    id="payNow"
    class="pay-button"
    href="https://selar.com/5772b1677z?add_to_cart=1"
    rel="noopener noreferrer"
  >
    PAY NOW
  </a>

  <p class="note">
    Tap PAY NOW to proceed to Selar and complete your payment.
  </p>

  <div class="footer">
    CELEBRATING LIVES EVERYDAY
  </div>

</div>

</body>
</html>
